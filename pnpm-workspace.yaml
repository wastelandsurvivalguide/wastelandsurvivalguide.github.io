minimumReleaseAge: 10080

blockExoticSubdeps: true

strictDepBuilds: true
allowBuilds:
  '@swc/core': true
  core-js-pure: true
  core-js: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'detect-port@1.6.1'
  - 'semver@6.3.1'

overrides:
  "serialize-javascript": "^7.0.5"
  "brace-expansion": "^5.0.8"
  "fast-uri": "^3.1.4"
  "uuid": "^11.1.1"

minimumReleaseAgeExclude:
  - brace-expansion@5.0.8
