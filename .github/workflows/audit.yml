name: PNPM Audit

on:
  #schedule:
    #- cron: "0 0 */3 * *"
  #pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2.0.2
        with:
          install: false

      - name: Audit
        run: pnpm audit
